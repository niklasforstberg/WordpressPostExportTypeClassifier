<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blogg-taggning</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #fff;
    --line: #e2e1dc;
    --ink: #1c1b19;
    --muted: #6f6d67;
    --story: #2f6f4f;
    --news: #2b5c9b;
    --event: #9b4a1f;
    --sel: #fdf3d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
  }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .counts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .counts b { color: var(--ink); }
  input[type=search] {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
    font: inherit; width: 240px; background: #fff;
  }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: #f0efec; }
  .tabs { display: flex; gap: 4px; }
  .downloads { display: flex; gap: 4px; }
  .downloads a { text-decoration: none; }
  .downloads button:disabled { opacity: 0.45; cursor: default; }
  .tabs button { border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  .tabs button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  progress { width: 120px; height: 6px; }

  main { padding: 8px 16px 60vh; }
  .row {
    display: grid;
    grid-template-columns: 84px 1fr auto;
    gap: 12px;
    align-items: start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .row.sel { background: var(--sel); border-color: #d9c67a; }
  .date { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 2px; }
  .title { font-weight: 600; text-decoration: none; color: inherit; }
  .title:hover { text-decoration: underline; }
  .terms { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 6px; vertical-align: 1px; }
  .term {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px; white-space: nowrap;
  }
  .excerpt {
    color: var(--muted); font-size: 13px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .actions { display: flex; gap: 4px; }
  .actions button { min-width: 62px; font-size: 13px; }
  .actions button[aria-pressed=true][data-type=story] { background: var(--story); border-color: var(--story); color: #fff; }
  .actions button[aria-pressed=true][data-type=news]  { background: var(--news);  border-color: var(--news);  color: #fff; }
  .actions button[aria-pressed=true][data-type=event] { background: var(--event); border-color: var(--event); color: #fff; }
  a#download { text-decoration: none; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  kbd {
    font: 11px ui-monospace, monospace; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted);
  }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Blogg-taggning</h1>
    <progress id="prog" max="1" value="0"></progress>
    <span class="counts" id="counts"></span>
    <span class="spacer"></span>
    <span class="hint"><kbd>1</kbd> story <kbd>2</kbd> news <kbd>3</kbd> event <kbd>0</kbd> rensa <kbd>↑↓</kbd> flytta</span>
    <input type="search" id="q" placeholder="Sök titel eller utdrag…">
    <button id="refresh">Hämta om</button>
  </div>
  <div class="bar" style="margin-top:8px">
    <div class="tabs" id="tabs"></div>
    <span class="spacer"></span>
    <span class="hint">Ladda ner:</span>
    <span class="downloads" id="downloads"></span>
  </div>
</header>
<main id="list"></main>

<script>
const TYPES = [
  { key: 'story', label: 'Story' },
  { key: 'news', label: 'News' },
  { key: 'event', label: 'Event' },
];
const FILTERS = [
  { key: 'all', label: 'Alla' },
  { key: 'untagged', label: 'Otaggade' },
  { key: 'story', label: 'Story' },
  { key: 'news', label: 'News' },
  { key: 'event', label: 'Event' },
];

let posts = [];
let filter = 'all';
let query = '';
let selectedId = null;

const $ = (id) => document.getElementById(id);

function visible() {
  const q = query.trim().toLowerCase();
  return posts.filter((p) => {
    if (filter === 'untagged' && p.type) return false;
    if (filter !== 'untagged' && filter !== 'all' && p.type !== filter) return false;
    if (q && !(p.title + ' ' + p.excerpt).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTabs() {
  $('tabs').innerHTML = '';
  for (const f of FILTERS) {
    const n = f.key === 'all' ? posts.length
      : f.key === 'untagged' ? posts.filter((p) => !p.type).length
      : posts.filter((p) => p.type === f.key).length;
    const b = document.createElement('button');
    b.textContent = `${f.label} ${n}`;
    b.setAttribute('aria-pressed', String(filter === f.key));
    b.onclick = () => { filter = f.key; render(); };
    $('tabs').appendChild(b);
  }
}

function renderDownloads() {
  const box = $('downloads');
  box.innerHTML = '';
  for (const t of TYPES) {
    const n = posts.filter((p) => p.type === t.key).length;
    const a = document.createElement('a');
    a.href = `/api/export/${t.key}`;
    a.download = `posts_${t.key}.json`;
    a.innerHTML = `<button type="button"${n ? '' : ' disabled'}>posts_${t.key}.json (${n})</button>`;
    if (!n) a.removeAttribute('href');
    box.appendChild(a);
  }
}

function render() {
  const rows = visible();
  if (!rows.some((p) => p.id === selectedId)) selectedId = rows.length ? rows[0].id : null;

  const tagged = posts.filter((p) => p.type).length;
  $('prog').max = posts.length || 1;
  $('prog').value = tagged;
  $('counts').textContent = `${tagged} / ${posts.length} taggade`;
  renderTabs();
  renderDownloads();

  const list = $('list');
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<div class="empty">Inget här.</div>';
    return;
  }
  for (const p of rows) {
    const row = document.createElement('div');
    row.className = 'row' + (p.id === selectedId ? ' sel' : '');
    row.dataset.id = p.id;
    row.onmousedown = () => { selectedId = p.id; paintSelection(); };

    const terms = [...p.categories, ...p.tags]
      .map((t) => `<span class="term">${esc(t)}</span>`).join('');

    row.innerHTML = `
      <div class="date">${p.date}</div>
      <div>
        <div><a class="title" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>
          <span class="terms">${terms}</span></div>
        <div class="excerpt">${esc(p.excerpt)}</div>
      </div>
      <div class="actions">${TYPES.map((t) =>
        `<button data-type="${t.key}" aria-pressed="${p.type === t.key}">${t.label}</button>`).join('')}
      </div>`;

    row.querySelectorAll('.actions button').forEach((b) => {
      b.onclick = () => setType(p.id, p.type === b.dataset.type ? null : b.dataset.type);
    });
    list.appendChild(row);
  }
  scrollSelectionIntoView();
}

function paintSelection() {
  document.querySelectorAll('.row').forEach((r) => {
    r.classList.toggle('sel', Number(r.dataset.id) === selectedId);
  });
}

function scrollSelectionIntoView() {
  const el = document.querySelector('.row.sel');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function setType(id, type) {
  const post = posts.find((p) => p.id === id);
  const previous = post.type;

  // Nästa rad enligt listan som den såg ut före ändringen — annars hoppar
  // markeringen till toppen så fort en post försvinner ur Otaggade-filtret.
  const before = visible();
  const i = before.findIndex((p) => p.id === id);
  const next = before[i + 1] || before[i - 1];

  post.type = type;
  if (next) selectedId = next.id;
  render();

  try {
    const res = await fetch('/api/type', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, type }),
    });
    if (!res.ok) throw new Error((await res.json()).error || res.status);
  } catch (err) {
    post.type = previous;
    render();
    alert('Kunde inte spara: ' + err.message);
  }
}

function move(delta) {
  const rows = visible();
  const i = rows.findIndex((p) => p.id === selectedId);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i + delta))];
  if (next) { selectedId = next.id; paintSelection(); scrollSelectionIntoView(); }
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  if (!selectedId) return;
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    e.preventDefault();
    setType(selectedId, TYPES[Number(e.key) - 1].key);
  } else if (e.key === '0' || e.key === 'Backspace') {
    e.preventDefault();
    setType(selectedId, null);
  } else if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault(); move(1);
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault(); move(-1);
  }
});

$('q').addEventListener('input', (e) => { query = e.target.value; render(); });
$('refresh').addEventListener('click', async () => {
  $('refresh').disabled = true;
  $('refresh').textContent = 'Hämtar…';
  try {
    const res = await fetch('/api/refresh', { method: 'POST' });
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    await load();
  } catch (err) {
    alert('Kunde inte hämta om: ' + err.message);
  } finally {
    $('refresh').disabled = false;
    $('refresh').textContent = 'Hämta om';
  }
});

async function load() {
  const res = await fetch('/api/posts');
  if (!res.ok) {
    $('list').innerHTML = '<div class="empty">Kunde inte hämta poster: ' + esc((await res.json()).error) + '</div>';
    return;
  }
  posts = (await res.json()).posts;
  render();
}

load();
</script>
</body>
</html>
